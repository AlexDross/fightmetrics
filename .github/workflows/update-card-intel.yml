name: Update Card Intel

on:
  schedule:
    - cron: '0 14 * * *'   # Daily 14:00 UTC
  workflow_dispatch:

jobs:
  update-card-intel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fightmetrics
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Generate upcoming card from TheRundown API
        run: python generate_upcoming_card.py
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}

      - name: Generate card intel (news, flags, odds history)
        run: python generate_card_intel.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/upcomingCard.js src/cardIntel.js
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update card intel $(date -u +'%Y-%m-%d')"
            git push
            echo "✅  Pushed updated card intel"
          fi

      - name: Trigger Vercel redeploy
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
