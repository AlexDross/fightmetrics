name: Update Fighters JSON

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday  14:00 UTC
    - cron: '0 14 * * 4'   # Thursday 14:00 UTC
  workflow_dispatch:
    inputs:
      greco_revision:
        description: >-
          Full Greco1899/scrape_ufc_stats commit SHA to build from (default: latest).
          Use it to re-run against the exact revision an upstream_corrections.json
          entry was reviewed for.
        required: false
        default: ''

jobs:
  update-fighters:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fightmetrics
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas requests

      # A shallow clone, not the branch zip: the zip of a moving branch carries
      # no revision, so a shipped refresh could not be traced to its inputs.
      # The clone's HEAD is the immutable commit every CSV below came from.
      - name: Download Greco1899 UFC stats CSVs
        id: greco
        env:
          GRECO_REVISION: ${{ inputs.greco_revision }}
        run: |
          git init --quiet greco
          git -C greco remote add origin https://github.com/Greco1899/scrape_ufc_stats.git
          git -C greco fetch --quiet --depth 1 origin "${GRECO_REVISION:-main}"
          git -C greco checkout --quiet FETCH_HEAD
          cp greco/ufc_fight_results.csv .
          cp greco/ufc_event_details.csv .
          cp greco/ufc_fight_details.csv .
          cp greco/ufc_fight_stats.csv .
          cp greco/ufc_fighter_tott.csv .
          cp greco/upcoming.csv . 2>/dev/null || true
          echo "revision=$(git -C greco rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "committed_at=$(git -C greco log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          echo "✅  CSVs downloaded at $(git -C greco rev-parse --short HEAD)"
          echo "fight_stats rows: $(wc -l < ufc_fight_stats.csv)"

      - name: Test source snapshot pinning
        run: python test_source_snapshot.py

      # Pins revision + per-file hashes in source_snapshot.json. update_fighters.py
      # refuses inputs that do not match it, so the ledger and the generation
      # record can only name the revision the CSVs actually came from.
      - name: Pin source snapshot
        run: >-
          python record_source_snapshot.py
          --revision "${{ steps.greco.outputs.revision }}"
          --committed-at "${{ steps.greco.outputs.committed_at }}"

      # Guards the undated-event handling BEFORE the updater runs, so a
      # regression fails fast and loudly instead of resurfacing as
      # "TypeError: '<' not supported between instances of 'float' and 'str'"
      # halfway through a rebuild. stdlib unittest — no extra dependency.
      - name: Test undated-event handling
        run: python test_fight_event_dates.py

      # One event-alias policy must hold across every aggregate input. Runs
      # before the updater so a duplicate-round-stat regression fails on
      # committed fixtures rather than silently inflating rate statistics.
      - name: Test aggregate input identity gates
        run: python test_fight_data_integrity.py

      # The completed-feed gate (feed_validation.py): duplicate stat rows,
      # impossible clocks and statistics, undated or future results, and the
      # fight-by-fight ledger check that refuses disappearing fights and
      # unreviewed outcome/date/fighter changes. Reviewed historical
      # exceptions live in feed_exceptions.json, reviewed upstream corrections
      # in upstream_corrections.json -- never generated by this workflow.
      - name: Test completed-feed validation and ledger
        run: python test_feed_validation.py

      - name: Test artifact publication rollback
        run: python test_artifact_publish.py

      # Every refusal above, driven through update_fighters.py itself on a
      # small committed feed, with published artifacts proven unchanged; plus
      # injected replacement failures at every position.
      - name: Test updater gates end to end
        run: python test_updater_gates.py

      - name: Test artifact-set verification
        run: python test_verify_artifact_set.py

      - name: Test recovery after an interrupted publish
        run: python test_recover_artifact_set.py

      # Provenance may only be re-derived by a run that regenerated the
      # artifact. Guards the manifest's module scoping before it is written.
      - name: Test source-manifest scoping
        run: python test_source_manifest_scope.py

      # The roster is read with ONE grammar. Two independently written `[^']`
      # patterns used to truncate at the backslash of an escaped apostrophe, so
      # nine fighters silently stopped receiving updates and 1,849 history
      # entries shipped with the weight class "Women\". Runs before the updater
      # so a reintroduced field-specific regex fails on fixtures rather than by
      # quietly freezing a fighter again.
      - name: Test JS roster parser
        run: python test_js_roster_parser.py

      # Tale-of-the-tape parsing and the fill-only-empty rule. A regression here
      # would let the scrape overwrite curated ages/heights/reaches, or put one
      # same-named fighter's profile on another.
      - name: Test fighter profile backfill
        run: python test_fighter_profiles.py

      - name: Run update_fighters.py
        run: python update_fighters.py

      # Same defect, now held against the artifacts this run just generated: no
      # truncated identity, no "Women\" weight class, and Sean O'Malley still at
      # four title bouts. tb is stored data the updater must not recompute while
      # every fight record carries wc:''.
      - name: Test correction-5 identity invariants
        run: python test_correction5_identity.py

      - name: Regenerate eloModule.js
        run: python regen_elo.py

      # Node is pinned BEFORE anything runs `node`, so the birth-date artifact
      # is generated on the same Node 24 that runs the tests and the build
      # rather than on whatever version the runner image happens to ship.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Must run BEFORE the source manifest: the manifest records this file's
      # content hash, so generating it afterwards would hash the previous run's
      # artifact and record provenance for data no longer on disk.
      - name: Regenerate fighter birth dates
        run: node scripts/generate-fighter-birthdates.mjs

      # Re-running the generator must be a no-op. If it is not, the output
      # depends on something other than fighters.json + name_aliases.json and
      # the bot would commit a churning artifact on every scheduled run.
      - name: Verify birth-date artifact is reproducible
        run: node scripts/generate-fighter-birthdates.mjs --check

      - name: Regenerate source manifest
        run: python generate_source_manifest.py

      # One generation: every update_fighters.py output matches
      # artifact_generation.json, every manifest module matches its contentHash,
      # and snapshot, ledger, generation record and manifest name one revision.
      - name: Verify the regenerated artifact set
        run: python scripts/verify_artifact_set.py

      - name: Validate generated JS is syntactically valid
        run: |
          node --input-type=module -e "
            const files = [
              './src/fightersData.js',
              './src/fightHistory.js',
              './src/eloModule.js',
              './src/cardioModule.js',
              './src/fighterBirthdates.js',
              './src/rankingsData.js',
              './src/rankingsHistoryData.js',
            ];
            let failed = false;
            for (const f of files) {
              try { await import(f); console.log('OK   ' + f); }
              catch (e) { failed = true; console.error('FAIL ' + f + ': ' + e.message); }
            }
            if (failed) process.exit(1);
          "

      # A roster refresh can rename or drop fighters, which would silently break
      # the official-ranking joins and the UI badges. Fail here rather than
      # shipping a roster the rankings no longer match.
      - name: Verify rankings still join to the refreshed roster
        run: npm run rankings:verify

      - name: Verify canonical fighter identity joins
        run: node scripts/verify-fighter-identity.mjs

      # ─── Stage 4 contract gate ──────────────────────────────────────────
      # An automated data refresh must not be able to push to main when it
      # breaks the model/statistics contracts. These three steps run against
      # the freshly regenerated data, before any commit or push.
      #
      # The suite is roster-independent by construction. DIVISION_UFC_AVERAGES
      # is derived from the whole _D2 roster, so it used to move on every
      # refresh and drag the model goldens with it. The characterisation tests
      # now inject a frozen normalisation context
      # (src/__tests__/inputs/model-context.input.json) while production
      # continues to read the live averages -- the app adapts to new data, the
      # tests do not drift.
      #
      # Verified: the same one-fighter asl/elo mutation that failed 3 tests
      # before this change leaves all 161 green, while the default production
      # output still moves on 4 of 74 model results.
      #
      # So a failure here is a real signal. Do NOT regenerate the approved
      # fixtures to make it pass -- escalate.
      #
      # Not covered: rankHistory's getHistoricalTier is still read live, so a
      # rankings change can legitimately move the goldens.
      - name: Install Node dependencies
        run: npm ci --include=dev

      - name: Run Vitest against the regenerated data
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/fightersData.js src/fightHistory.js src/eloModule.js src/cardioModule.js src/fighterBirthdates.js src/sourceManifest.js fighter_profiles.json source_snapshot.json source_ledger.json artifact_generation.json
          # Checks what will be COMMITTED, not the working tree: an artifact
          # regenerated above but missing from the `git add` list leaves a stale
          # staged copy that no longer matches the staged hashes, and fails here.
          python scripts/verify_artifact_set.py --index
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update fighter data $(date -u +'%Y-%m-%d')"
            git push
            echo "✅  Pushed updated fighter data"
          fi

      - name: Trigger Vercel redeploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
