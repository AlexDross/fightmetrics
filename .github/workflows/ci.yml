name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow verifies, it never writes to the repository.
permissions:
  contents: read

# A new push to a PR cancels the in-flight run for that PR. Runs on main are
# keyed by SHA so they are never cancelled by a subsequent merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --include=dev is explicit: NODE_ENV=production in the environment would
      # otherwise make npm omit devDependencies, taking vitest and vite with it.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rankings dependencies
        run: pip install -r requirements-rankings.txt

      # Roster identity. Two independently written `[^']` patterns used to
      # truncate at the backslash of an escaped apostrophe, freezing nine
      # fighters and shipping 1,849 history entries with the weight class
      # "Women\". Both suites are stdlib-only and read no feed.
      - name: JS roster parser tests
        run: python test_js_roster_parser.py

      - name: Correction-5 identity invariants
        run: python test_correction5_identity.py

      - name: Run Vitest
        run: npm test

      - name: Rankings input-validation tests
        run: npm run rankings:test

      - name: Verify rankings contracts
        run: npm run rankings:verify

      - name: Verify fighter identity joins
        run: node scripts/verify-fighter-identity.mjs

      # Regeneration must be reproducible from committed inputs alone: no
      # network, no Kaggle, byte-identical output.
      - name: Rankings regenerate deterministically offline
        run: |
          set -euo pipefail
          before=$(shasum -a 256 src/rankingsData.js src/rankingsHistoryData.js)
          npm run rankings:regen
          after=$(shasum -a 256 src/rankingsData.js src/rankingsHistoryData.js)
          if [ "$before" != "$after" ]; then
            echo "::error::rankings artifacts are not reproducible from committed inputs"
            git --no-pager diff --stat -- src/rankingsData.js src/rankingsHistoryData.js
            exit 1
          fi
          echo "both rankings artifacts regenerated byte-identically"
          echo "$after"

      - name: Production build
        run: npm run build

      # The ~190 kB history artifact must never reach a browser.
      - name: Historical data must not reach the bundle
        run: npm run rankings:bundle-check

      # The Vite outDir is `build`, not `dist`. Checking the wrong directory
      # makes every assertion below vacuously pass, so the first check is that
      # the directory exists and has files in it.
      - name: Verify build output
        run: |
          set -euo pipefail

          if [ ! -d build ]; then
            echo "::error::build/ does not exist"
            exit 1
          fi

          file_count=$(find build -type f | wc -l | tr -d ' ')
          echo "build/ contains $file_count files"
          if [ "$file_count" -eq 0 ]; then
            echo "::error::build/ is empty"
            exit 1
          fi

          fail=0

          map_count=$(find build -name '*.map' | wc -l | tr -d ' ')
          if [ "$map_count" -ne 0 ]; then
            echo "::error::build/ contains $map_count source map(s)"
            find build -name '*.map'
            fail=1
          fi

          # Dev-only golden bridge markers. These were removed in Stage 4; if any
          # reappears in a production bundle the dev guard has regressed.
          for marker in '__FM_GOLDEN_INTERNALS__' '__fmGoldens' 'goldenHarness'; do
            if grep -rqF "$marker" build; then
              echo "::error::build/ contains the dev-only marker $marker"
              grep -rlF "$marker" build
              fail=1
            fi
          done

          # The Play CDN was replaced by a compiled Tailwind stylesheet in Stage 2.
          if grep -rqF 'cdn.tailwindcss.com' build; then
            echo "::error::build/ references the Tailwind Play CDN"
            grep -rlF 'cdn.tailwindcss.com' build
            fail=1
          fi

          # Test fixtures must never ship. 'GOLDEN FIXTURE EVENT' is the synthetic
          # event name in entries.golden.json; the other two are provenance keys
          # unique to the frozen statistics input. All three are verified to be
          # present in src/__tests__/, so these greps are not vacuous.
          for marker in 'GOLDEN FIXTURE EVENT' 'canonicalEntriesSha256' 'roiDataBlob'; do
            if grep -rqF "$marker" build; then
              echo "::error::build/ contains the test-fixture marker $marker"
              grep -rlF "$marker" build
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "build/ output checks passed"

  # The Stage 7 tier that needs a database. It is deliberately a SEPARATE job so
  # a failure here reads as a database failure rather than being folded into the
  # build. The two stale corpus literals that reached `main` in
  # `tests/api/rpc-seed.test.mjs` did so precisely because nothing in CI ran
  # `test:api`.
  #
  # ENFORCEMENT, stated accurately: this job runs as its own check on pull
  # requests and on pushes to `main`, so its result is visible on every PR — but
  # `main` is NOT branch-protected, so a red check here does not by itself block
  # a merge. During this rollout the check must be treated as required BY HAND.
  # Making it enforceable needs a branch-protection rule or a repository ruleset,
  # which is not configured and is deliberately outside this change.
  database:
    name: Database and API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # Pinned to the exact version committed as a devDependency, so CI and a
      # developer's machine run the same CLI. Bumping one without the other is a
      # drift this pin makes visible.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      # LOCAL and UNLINKED, always. This starts the stack from the committed
      # `supabase/` directory on the runner's own Docker: no project ref, no
      # `supabase link`, no `--linked`, no hosted credentials and no production
      # data. `npm run db:start` is the committed command, so CI exercises the
      # same full stack a developer does.
      #
      # OUTPUT IS SUPPRESSED, and that is load-bearing rather than tidiness: on a
      # successful start the CLI prints the local anon key, the service-role /
      # secret key, the JWT secret and the database URL to stdout, and on a slow
      # start it dumps container logs to stderr. They are only the well-known
      # local dev defaults, but CI logs are not the place for any of it. The
      # redirection does not touch the exit status, so a failed start still fails
      # the step; the failure-only diagnostics below are where troubleshooting
      # evidence comes from.
      - name: Start local Supabase stack
        run: npm run db:start >/dev/null 2>&1

      - name: pgTAP suites
        run: npm run test:db

      # Self-resetting: `test:api` runs `db:reset` before the suite.
      - name: API suites over real HTTP
        run: npm run test:api

      # Diagnostics only on failure, and deliberately narrow: container names and
      # health, plus the Postgres log. Nothing here prints keys, and this
      # workflow never invokes `supabase status` itself.
      #
      # `supabase status -o json` IS executed — inside `npm run test:api`, by
      # `tests/api/helpers.mjs`, which needs the REST URL, the anon key and the
      # JWT secret to sign the tokens that exercise the real authenticated path.
      # That helper captures both stdout and stderr, reduces the response to
      # exactly those three fields (the service-role/secret key, publishable key
      # and database URL are discarded, not merely unused), keeps them
      # in-process, logs nothing, and re-throws every failure as a hand-written
      # message with no child-process error, stdout or stderr attached. Saying
      # the command is never run would be false; what is true is that its output
      # never reaches this log.
      - name: Container diagnostics
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          echo '--- postgres log (tail) ---'
          docker logs --tail 100 supabase_db_fightmetrics 2>&1 || true

      # Runs whether the suites passed or failed, and cannot change the job's
      # outcome in either direction: `always()` guarantees the teardown, and
      # `continue-on-error` keeps a teardown hiccup from turning a real pass into
      # a failure or a real failure into a pass.
      #
      # Output suppressed for the same reason as the start step. `supabase stop`
      # is not known to print keys, but it is CLI output from the same tool on a
      # path whose contents are not part of any contract, and the teardown has
      # nothing to say that is worth reading. Semantics are unchanged: `always()`
      # and `continue-on-error` still govern when it runs and what it can affect.
      - name: Stop local Supabase stack
        if: always()
        continue-on-error: true
        run: npm run db:stop >/dev/null 2>&1

# Deliberately no `git diff --check` step here: on a fresh checkout the working
# tree always matches the index, so it would pass unconditionally and prove
# nothing. It is a local pre-commit check and is run as such.
